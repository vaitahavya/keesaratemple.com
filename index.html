<!doctype html>
<html lang="te">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="శ్రీ రామ లింగేశ్వర స్వామి దేవాలయం, కీసరగుట్ట — త్వరలో మీకు సేవ చేయడానికి వస్తున్నాం"
    />
    <title>శ్రీ రామ లింగేశ్వర స్వామి | కీసరగుట్ట</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <header class="message" aria-live="polite">
        <div class="message__glow" aria-hidden="true"></div>
        <div class="message__panel">
          <p class="message__label">శ్రీ రామ లింగేశ్వర స్వామి</p>
          <p class="message__text">
            అనుగ్రహం తో త్వరలో మీకు సేవ చెయ్యడానికి వస్తున్నాం
          </p>
        </div>
      </header>

      <section class="scroll-stage" aria-label="Temple photo slideshow">
        <div class="slideshow">
          <div class="slideshow__frame">
            <div class="slideshow__track"></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
